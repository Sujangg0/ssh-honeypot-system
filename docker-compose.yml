services:
    cowrie:
        image: cowrie/cowrie:latest
        container_name: cowrie-ssh-honeypot
        ports:
            - "2222:2222"
        volumes:
            - ./cowrie/log:/cowrie/cowrie-git/var/log/cowrie
        networks:
            - ssh-honeypot
        restart: unless-stopped
       
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
        container_name: elasticsearch-ssh-honeypot
        environment:
            - node.name=elasticsearch
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms1g -Xmx1g
        ports: 
            - "9200:9200"
        volumes:
            - ./elasticsearch/elasticsearch-data:/usr/share/elasticsearch/data
        networks:
            - ssh-honeypot
        mem_limit: 2g
        restart: unless-stopped

    kibana:
        image: docker.elastic.co/kibana/kibana:9.0.2
        container_name: kibana-ssh-honeypot
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        ports:
            - "5601:5601"
        depends_on:
            - elasticsearch
        networks:
            - ssh-honeypot
        mem_limit: 1g
        restart: unless-stopped
            
    filebeat:
        image: docker.elastic.co/beats/filebeat:9.0.2
        container_name: filebeat-ssh-honeypot
        user: root
        volumes:
            - ./cowrie/log:/var/log/cowrie:ro
            - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
        depends_on:
            - elasticsearch
        networks:
            - ssh-honeypot
        command: ["--strict.perms=false"]
        restart: unless-stopped
        
        
networks:
    ssh-honeypot:
